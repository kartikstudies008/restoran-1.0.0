<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Login - Restoran</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />

  <link href="img/favicon.ico" rel="icon" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- CSS -->
  <link href="css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>

<body>
<div class="container-xxl bg-white p-0">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0">
    <a href="index.html" class="navbar-brand p-0">
      <h1 class="text-primary m-0"><i class="fa fa-utensils me-3"></i>Restoran</h1>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
      <span class="fa fa-bars"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarCollapse">
      <div class="navbar-nav ms-auto py-0 pe-4">
        <a href="index.html" class="nav-item nav-link">Home</a>
        <a href="booking.html" class="nav-item nav-link">Booking</a>
        <a href="admin-login.html" class="nav-item nav-link active">Admin</a>
      </div>
      <a href="booking.html" class="btn btn-primary py-2 px-4">Book A Table</a>
    </div>
  </nav>

  <!-- HERO -->
  <div class="container-xxl py-5 bg-dark hero-header mb-5">
    <div class="container text-center my-5 pt-5 pb-4">
      <h1 class="display-3 text-white mb-3">Admin Login</h1>
      <p class="text-white-50 mb-0">Access the centralized approvals portal</p>
    </div>
  </div>

  <!-- LOGIN CARD -->
  <div class="container-xxl py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-lg-5">
              <h4 class="mb-4">Sign in</h4>

              <div class="alert alert-danger d-none" id="loginError">
                Invalid credentials. Try <b>admin@restoran.com</b> / <b>admin123</b>
              </div>

              <form id="adminLoginForm" autocomplete="off">
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" id="adminEmail" placeholder="admin@restoran.com" required />
                </div>

                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control" id="adminPassword" placeholder="********" required />
                </div>

                <button class="btn btn-primary w-100 py-2" type="submit">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>

                <div class="small text-muted mt-3">
                  Demo credentials: <b>admin@restoran.com</b> / <b>admin123</b>
                </div>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER (simple) -->
  <div class="container-fluid bg-dark text-light footer pt-5 mt-5">
    <div class="container py-4 text-center">
      <small>© Restoran Admin Portal</small>
    </div>
  </div>

  <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
