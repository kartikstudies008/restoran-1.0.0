<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Restoran - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="img/favicon.ico" rel="icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
<div class="container-xxl bg-white p-0">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0">
    <a href="index.html" class="navbar-brand p-0">
        <h1 class="text-primary m-0">
            <i class="fa fa-utensils me-3"></i>Restoran
        </h1>
    </a>
</nav>

<!-- HERO -->
<div class="container-xxl py-5 bg-dark hero-header mb-5">
    <div class="container text-center my-5 pt-5 pb-4">
        <h1 class="display-3 text-white mb-3">Customer Login</h1>
    </div>
</div>

<!-- LOGIN FORM -->
<div class="container-xxl py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 bg-dark p-5 rounded">
                <h2 class="text-white mb-4 text-center">Login</h2>

                <form id="loginForm">
                    <input type="email" class="form-control mb-3" id="email" placeholder="Email Address" required>
                    <input type="password" class="form-control mb-3" id="password" placeholder="Password" required>

                    <button class="btn btn-primary w-100 py-2" type="submit">
                        Login
                    </button>
                </form>

                <p class="text-center text-light mt-3">
                    New user?
                    <a href="customerreg.html" class="text-primary">Create account</a>
                </p>
            </div>
        </div>
    </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    // Redirect to the homepage after (client-side) login
    window.location.href = "index.html";
});
</script>

</body>
</html>
