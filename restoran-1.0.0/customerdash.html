<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Restoran - Client Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="img/favicon.ico" rel="icon">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
<div class="container-xxl bg-white p-0">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0">
    <a href="index.html" class="navbar-brand p-0">
        <h1 class="text-primary m-0">
            <i class="fa fa-utensils me-3"></i>Restoran
        </h1>
    </a>

    <div class="ms-auto">
        <a href="booking.html" class="btn btn-primary me-2">Book Table</a>
        <button class="btn btn-outline-light" onclick="logout()">Logout</button>
    </div>
</nav>

<!-- HERO -->
<div class="container-xxl py-5 bg-dark hero-header mb-5">
    <div class="container text-center my-5 pt-5 pb-4">
        <h1 class="display-4 text-white mb-3" id="welcomeText">Client Dashboard</h1>
        <p class="text-light">View and manage your booking requests</p>
    </div>
</div>

<!-- DASHBOARD CONTENT -->
<div class="container-xxl py-5">
    <div class="container">

        <h2 class="mb-4">My Bookings</h2>

        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Date & Time</th>
                        <th>People</th>
                        <th>Message</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="bookingTable">
                </tbody>
            </table>
        </div>

        <div id="noBookings" class="text-center text-muted mt-4" style="display:none;">
            No bookings found.
        </div>

    </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// ================= AUTH PROTECTION =================
const user = JSON.parse(localStorage.getItem("loggedInUser"));

if (!user) {
    alert("Please login first!");
    window.location.href = "customerlogin.html";
}

// show welcome name
document.getElementById("welcomeText").innerText = "Welcome, " + user.name;


// ================= LOGOUT =================
function logout() {
    localStorage.removeItem("loggedInUser");
    window.location.href = "customerlogin.html";
}


// ================= LOAD BOOKINGS =================
function loadBookings() {

    const bookings = JSON.parse(localStorage.getItem("bookings") || "[]");
    const table = document.getElementById("bookingTable");
    const noBookings = document.getElementById("noBookings");

    table.innerHTML = "";

    // filter only this user's bookings
    const myBookings = bookings.filter(b => b.email === user.email);

    if (myBookings.length === 0) {
        noBookings.style.display = "block";
        return;
    }

    noBookings.style.display = "none";

    myBookings.forEach(b => {

        let badge = "secondary";
        if (b.status === "APPROVED") badge = "success";
        if (b.status === "REJECTED") badge = "danger";

        table.innerHTML += `
            <tr>
                <td>${b.datetime}</td>
                <td>${b.people}</td>
                <td>${b.message || "-"}</td>
                <td>
                    <span class="badge bg-${badge}">
                        ${b.status}
                    </span>
                </td>
            </tr>
        `;
    });
}

loadBookings();

</script>

</body>
</html>
