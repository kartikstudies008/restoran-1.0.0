<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Dashboard - Restoran</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />

  <link href="img/favicon.ico" rel="icon" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet" />

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

  <link href="css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />

  <style>
    .status-badge { font-size: 12px; padding: 6px 10px; border-radius: 999px; }
    .status-pending { background: rgba(254,161,22,.15); color: #FEA116; }
    .status-approved { background: rgba(25,135,84,.15); color: #198754; }
    .status-rejected { background: rgba(220,53,69,.15); color: #dc3545; }
  </style>
</head>

<body>
<div class="container-xxl bg-white p-0">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0 sticky-top">
    <a href="index.html" class="navbar-brand p-0">
      <h1 class="text-primary m-0"><i class="fa fa-utensils me-3"></i>Restoran</h1>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
      <span class="fa fa-bars"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarCollapse">
      <div class="navbar-nav ms-auto py-0 pe-4">
        <a href="admin-dashboard.html" class="nav-item nav-link active">Dashboard</a>
      </div>
      <button class="btn btn-outline-light py-2 px-4" id="btnLogout">
        <i class="bi bi-box-arrow-right me-2"></i>Logout
      </button>
    </div>
  </nav>

  <!-- HEADER -->
  <div class="container-xxl py-5 bg-dark hero-header mb-4" style="padding: 60px 0;">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-lg-8">
          <h1 class="text-white mb-1">Admin Dashboard</h1>
          <p class="text-white-50 mb-0">Centralized approvals for booking requests</p>
        </div>
        <div class="col-lg-4 text-lg-end">
          <span class="text-white-50 small">Logged in as:</span>
          <div class="text-white fw-bold" id="adminNameText">Admin</div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="container-xxl pb-5">
    <div class="container">

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <input type="text" id="searchBox" class="form-control" placeholder="Search name / phone..." />
        </div>
        <div class="col-md-3">
          <select id="statusFilter" class="form-select">
            <option value="ALL">All Status</option>
            <option value="PENDING">Pending</option>
            <option value="APPROVED">Approved</option>
            <option value="REJECTED">Rejected</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="date" id="dateFilter" class="form-control" />
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100" id="btnClearFilters">
            Clear
          </button>
        </div>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
              <tr>
                <th class="ps-4">Client</th>
                <th>Date</th>
                <th>Time</th>
                <th>People</th>
                <th>Status</th>
                <th class="text-end pe-4">Actions</th>
              </tr>
              </thead>
              <tbody id="bookingTableBody">
              <!-- Rows inserted by JS -->
              </tbody>
            </table>
          </div>

          <div class="p-4 d-none" id="emptyState">
            <div class="text-center">
              <i class="bi bi-inbox display-6 text-muted"></i>
              <p class="mt-2 mb-0 text-muted">No booking requests found.</p>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="container-fluid bg-dark text-light footer pt-4">
    <div class="container py-3 text-center">
      <small>© Restoran Admin Portal</small>
    </div>
  </div>

  <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
