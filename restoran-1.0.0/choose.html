<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Restoran - Choose Role</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="img/favicon.ico" rel="icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        .role-card {
            transition: transform 0.3s;
            cursor: pointer;
        }
        .role-card:hover {
            transform: translateY(-10px);
        }
    </style>
</head>

<body>
<div class="container-xxl bg-white p-0">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0">
    <a href="index.html" class="navbar-brand p-0">
        <h1 class="text-primary m-0">
            <i class="fa fa-utensils me-3"></i>Restoran
        </h1>
    </a>
</nav>

<!-- HERO -->
<div class="container-xxl py-5 bg-dark hero-header mb-5">
    <div class="container text-center my-5 pt-5 pb-4">
        <h1 class="display-4 text-white mb-3">Welcome</h1>
        <p class="text-light">Choose how you want to continue</p>
    </div>
</div>

<!-- ROLE SELECTION -->
<div class="container-xxl py-5">
    <div class="container">
        <div class="row g-4 justify-content-center">

            <!-- CUSTOMER -->
            <div class="col-lg-4 col-md-6">
                <div class="bg-dark text-center p-5 role-card rounded"
                     onclick="window.location.href='customerreg.html'">
                    <i class="fa fa-user fa-4x text-primary mb-3"></i>
                    <h3 class="text-white">Customer</h3>
                    <p class="text-light">
                        Book tables and track your booking status
                    </p>
                    <button class="btn btn-primary mt-3">
                        Continue as Customer
                    </button>
                </div>
            </div>

            <!-- ADMIN -->
            <div class="col-lg-4 col-md-6">
                <div class="bg-dark text-center p-5 role-card rounded"
                     onclick="window.location.href='adminportal.html'">
                    <i class="fa fa-user-shield fa-4x text-primary mb-3"></i>
                    <h3 class="text-white">Admin</h3>
                    <p class="text-light">
                        Manage and approve booking requests
                    </p>
                    <button class="btn btn-primary mt-3" onclick="window.location.href='adminportal.html'">
                        Continue as Admin
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
